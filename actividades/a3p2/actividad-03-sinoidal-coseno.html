<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>A3 - Animación con onda sinoidal/coseno</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Animación con onda sinoidal/coseno</h1>

  <canvas id="canvas" width="1000" height="900"></canvas>

  <script src="./classes/ovni.js"></script>

  <script>
    window.onload = function () {

      var canvas = document.getElementById("canvas"),
          context = canvas.getContext("2d"),
          ovni = new Ovni(),

          angle = 0,
          centerX = canvas.width / 2,
          centerY = canvas.height / 2,

          rangeX = 250,
          rangeY = 100,

          centerScale = 1,
          rangeScale = 0.2,

          speed = 0.03;


      (function drawFrame() {

        window.requestAnimationFrame(drawFrame, canvas);

        context.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        // MOVIMIENTO HORIZONTAL - SENO
        ovni.x =
          centerX + Math.sin(angle) * rangeX;


        // MOVIMIENTO VERTICAL - COSENO
        ovni.y =
          centerY + Math.cos(angle) * rangeY;


        // PULSO
        ovni.scaleX =
          ovni.scaleY =
          centerScale + Math.sin(angle * 3) * rangeScale;


        angle += speed;


        ovni.draw(context);

      }());

    };
  </script>

</body>
</html>
